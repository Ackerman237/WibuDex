<!DOCTYPE html>

<body>

  <header class="site-nav safe-top">
    <div class="site-nav__inner container">
      <a class="site-nav__brand ui-text" href="/manga/html/index.html">Wibu<span>dex</span></a>

      <nav class="nav-links" id="navLinks" aria-label="Navigasi utama">
        <a href="/manga/html/index.html">Home</a>
        <a href="/manga/html/catalog.html">Jelajah</a>
        <a href="/video/html/" class="nav-mod-video"><svg class="ic nav-ic" aria-hidden="true"><use href="/manga/icons.svg#i-play"></use></svg>Video</a>

      </button>

    <svg class="ic" aria-hidden="true"><use href="/manga/icons.svg#i-arrow-up"></use></svg>

  <!-- Urutan penting: utils → ui → api → storage → nav → bottom-nav → screen -->

  <script src="/shared/api.js" defer></script>
