<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neko Video Streaming</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="/nekoPage/css/base.css">
  <link rel="stylesheet" href="/nekoPage/css/index.css">

  <!-- Favicon & tema browser mobile -->
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon.png">
  <meta name="theme-color" content="#15120f">
  <link rel="manifest" href="/manifest.json">
  <!-- Service Worker (offline cache) -->
  <script src="/js/register-sw.js" defer></script>
  <script src="/shared/utils.js"></script>
</head>
<body>
  <header>
    <div class="nav-container">
      <div class="brand">
        <a href="/neko/">
          <h1>Neko Video</h1>
        </a>
      </div>
      <nav class="nav-links" id="navLinks">
        <a href="/">MANGA</a>
        <a href="/neko/" class="active">NEKO VIDEO</a>
        <div class="nav-dropdown" id="categoriesDropdown">
          <button type="button" class="nav-drop-toggle" aria-expanded="false" aria-haspopup="true">CATEGORIES ▾</button>
          <div class="nav-drop-menu">
            <p class="nav-drop-loading">Memuat kategori...</p>
          </div>
        </div>
      </nav>
      <form id="searchForm" class="search-box">
        <input type="text" id="searchInput" placeholder="Cari video Neko...">
        <button type="submit">CARI</button>
      </form>
      <button class="nav-hamburger" id="navHamburger" type="button" aria-label="Buka menu" aria-expanded="false" aria-controls="navLinks">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main>
    <!-- Aksi cepat (kategori kini lewat dropdown CATEGORIES di navbar) -->
    <section class="categories-section">
      <div class="categories-actions">
        <button id="randomBtn" class="category-btn random-btn" type="button">🎲 ACAK</button>
        <a class="category-btn" href="/nekoPage/html/series.html?type=hentai">DAFTAR HENTAI</a>
        <a class="category-btn" href="/nekoPage/html/series.html?type=jav">DAFTAR JAV</a>
      </div>
    </section>

    <!-- Jadwal New Hentai -->
    <section class="manga-section schedule-section">
      <h2 class="section-title">📅 Jadwal New Hentai</h2>
      <div id="scheduleContainer">
        <p class="loading">Memuat jadwal...</p>
      </div>
    </section>

    <section class="manga-section">
      <h2 id="sectionTitle" class="section-title">Video Terbaru</h2>
      <div id="videoGrid" class="video-grid">
        <p class="loading">Memuat video...</p>
      </div>
      <div class="load-more-container">
        <button id="loadMoreBtn" class="btn-see-more">SEE MORE</button>
      </div>
    </section>
  </main>

  <button id="backToTop" class="back-to-top" title="Kembali ke atas">▲</button>

  <script src="/nekoPage/js/nav.js" defer></script>
  <script src="/nekoPage/js/index.js" defer></script>
</body>
</html>
