<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Video - Neko</title>
  <link rel="stylesheet" href="/nekoPage/css/base.css">
  <link rel="stylesheet" href="/nekoPage/css/watch.css?v=3">
  <link rel="stylesheet" href="/nekoPage/css/index.css">

  <!-- Favicon & tema browser mobile -->
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon.png">
  <meta name="theme-color" content="#15120f">
  <link rel="manifest" href="/manifest.json">
  <!-- Service Worker (offline cache) -->
  <script src="/js/register-sw.js" defer></script>
</head>
<body>

  <header>
    <div class="nav-container">
      <div class="brand">
        <a href="/neko/">
          <h1>Neko Video</h1>
        </a>
      </div>
      <nav class="nav-links" id="navLinks">
        <a href="/">MANGA</a>
        <a href="/neko/" class="active">NEKO VIDEO</a>
        <div class="nav-dropdown" id="categoriesDropdown">
          <button type="button" class="nav-drop-toggle" aria-expanded="false" aria-haspopup="true">CATEGORIES ▾</button>
          <div class="nav-drop-menu">
            <p class="nav-drop-loading">Memuat kategori...</p>
          </div>
        </div>
      </nav>
      <button class="nav-hamburger" id="navHamburger" type="button" aria-label="Buka menu" aria-expanded="false" aria-controls="navLinks">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main class="player-container">

    <div class="watch-head">
      <h2 id="videoTitle" class="video-title-main">Memuat Judul...</h2>
      <span class="live-badge"><span class="live-dot"></span>STREAMING</span>
    </div>

    <div class="player-card">
      <div class="video-wrapper" id="playerBox">
        <p class="player-loading-text">Memuat Player Video...</p>
      </div>

      <!-- Tombol Pilihan Server -->
      <div id="serverSelectorContainer" class="server-selector"></div>

      <!-- Tombol Cadangan jika terkena blokir -->
      <div class="external-fallback" id="externalFallbackContainer" style="display: none;">
        <a id="externalPlayerBtn" href="#" target="_blank" class="external-btn">
          🔗 Buka Player di Tab Baru (Jika Layar Hitam / Terblokir)
        </a>
      </div>
    </div>

    <section class="video-details">
      <h3 class="panel-title"><span class="icon">☰</span> Sinopsis</h3>
      <p id="videoSynopsis" class="synopsis-text"></p>
    </section>

    <section class="video-details related-section" id="relatedSection" style="display:none;">
      <h3 class="panel-title"><span class="icon">✨</span> Video Terkait</h3>
      <div id="relatedGrid" class="related-grid"></div>
    </section>

  </main>

  <script src="/nekoPage/js/nav.js" defer></script>
  <script src="/nekoPage/js/watch.js?v=7" defer></script>
</body>
</html>
