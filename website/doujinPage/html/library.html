<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library & Bookmarks — Doujin Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/doujinPage/css/base.css?v=3">
  <link rel="stylesheet" href="/doujinPage/css/components.css?v=3">
  <link rel="stylesheet" href="/doujinPage/css/cards.css?v=3">
  <link rel="stylesheet" href="/doujinPage/css/library.css?v=3">

  <!-- Favicon & tema browser mobile -->
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon.png">
  <meta name="theme-color" content="#15120f">
  <link rel="manifest" href="/manifest.json">
  <!-- Service Worker (offline cache) -->
  <script src="/js/register-sw.js" defer></script>
</head>
<body>
  <!-- HEADER / NAVBAR -->
  <header>
    <div class="nav-container">
      <div class="brand">
        <a href="/doujinPage/html/index.html">
          <h1>Doujin Library</h1>
        </a>
      </div>

      <nav class="nav-links" id="navLinks">
        <a href="/nekoPage/html/">NEKO VIDEO</a>
        <a href="/doujinPage/html/index.html">HOME</a>
        <a href="/doujinPage/html/allManga.html">ALL</a>
        <a href="/doujinPage/html/categories.html">CATEGORIES</a>
        <a href="/doujinPage/html/library.html" class="active">LIBRARY</a>
        <a href="/doujinPage/html/account.html">ACCOUNT</a>
      </nav>

      <form id="searchForm" class="search-box">
        <input type="text" id="searchInput" placeholder="Cari judul komik...">
        <button type="submit">CARI</button>
      </form>

      <button class="nav-hamburger" id="navHamburger" type="button" aria-label="Buka menu" aria-expanded="false" aria-controls="navLinks">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main class="library-container">
    <div class="library-header">
      <h1 class="library-title">My Library</h1>
      <div class="library-search">
        <input type="text" id="librarySearch" placeholder="Search your library..." autocomplete="off">
      </div>
    </div>

    <section class="library-section">
      <div class="section-header">
        <h2><svg class="ic" aria-hidden="true"><use href="/doujinPage/icons.svg#i-heart"></use></svg> Favorite Manga</h2>
      </div>
      <div class="manga-grid" id="favoriteGrid"></div>
      <div class="empty-state" id="favoriteEmpty" style="display: none;">Belum ada manga yang ditambahkan ke Favorite.</div>
      <button class="see-more-btn" id="favoriteSeeMore" style="display: none;">SEE MORE <svg class="ic" aria-hidden="true"><use href="/doujinPage/icons.svg#i-chevron-down"></use></svg></button>
    </section>

    <section class="library-section">
      <div class="section-header">
        <h2><svg class="ic" aria-hidden="true"><use href="/doujinPage/icons.svg#i-bookmark"></use></svg> Bookmarked Manga</h2>
      </div>
      <div class="manga-grid" id="bookmarkGrid"></div>
      <div class="empty-state" id="bookmarkEmpty" style="display: none;">Belum ada manga yang di-bookmark.</div>
      <button class="see-more-btn" id="bookmarkSeeMore" style="display: none;">SEE MORE <svg class="ic" aria-hidden="true"><use href="/doujinPage/icons.svg#i-chevron-down"></use></svg></button>
    </section>
  </main>

  <button id="backToTop" class="back-to-top" title="Kembali ke atas"><svg class="ic" aria-hidden="true"><use href="/doujinPage/icons.svg#i-arrow-up"></use></svg></button>

  <script src="/doujinPage/shared/nav.js?v=3" defer></script>
  <script src="/doujinPage/shared/api.js?v=3" defer></script>
  <script src="/doujinPage/shared/ui.js?v=3" defer></script>
  <script src="/doujinPage/shared/storage.js?v=3" defer></script>
  <script src="/doujinPage/js/library.js?v=3" defer></script>
</body>
</html>
