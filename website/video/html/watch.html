<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Watch Video - Neko</title>
  <link rel="stylesheet" href="/css/wibudex-tokens.css">
  <link rel="stylesheet" href="/video/css/base.css">
  <link rel="stylesheet" href="/video/css/watch.css?v=6">

  <!-- Favicon & tema browser mobile -->
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon.png">
  <meta name="theme-color" content="#0D0C0C">
  <link rel="manifest" href="/manifest.json">
  <!-- Service Worker (offline cache) -->
  <script src="/js/register-sw.js" defer></script>
  <script src="/shared/utils.js" defer></script>
  <script src="/video/js/cards.js" defer></script>
</head>
<body>

  <header>
    <div class="nav-container">
      <div class="brand">
        <a href="/neko/">
          <h1>Neko Video</h1>
        </a>
      </div>
      <nav class="nav-links" id="navLinks">
        <a href="/">MANGA</a>
        <a href="/neko/" class="active">NEKO VIDEO</a>
        <div class="nav-dropdown" id="categoriesDropdown">
          <button type="button" class="nav-drop-toggle" aria-expanded="false" aria-haspopup="true">CATEGORIES ▾</button>
          <div class="nav-drop-menu">
            <p class="nav-drop-loading">Memuat kategori...</p>
          </div>
        </div>
      </nav>
      <button class="nav-hamburger" id="navHamburger" type="button" aria-label="Buka menu" aria-expanded="false" aria-controls="navLinks">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main class="watch-layout">

    <!-- Kolom kiri: player + info -->
    <div class="watch-main">
      <div class="player-card">
        <div class="video-wrapper" id="playerBox">
          <p class="player-loading-text">Memuat Player Video...</p>
        </div>
      </div>

      <!-- Tombol Pilihan Server -->
      <div id="serverSelectorContainer" class="server-selector"></div>

      <!-- Toolbar: mode player + theater -->
      <div class="watch-toolbar">
        <div class="pf-mode-toggle-host" id="pfModeToggleHost"></div>
        <button id="theaterToggleBtn" class="theater-toggle" type="button" aria-pressed="false">
          Mode Teater
        </button>
      </div>

      <div class="watch-info">
        <div class="watch-badges">
          <span class="live-badge"><span class="live-dot"></span>STREAMING</span>
          <span class="content-badge" id="contentTypeBadge"></span>
        </div>
        <h1 id="videoTitle" class="watch-title">Memuat Judul...</h1>
        <div class="watch-meta" id="watchMeta"></div>
        <div id="watchGenres" class="watch-genres" style="display:none" aria-label="Genre"></div>

        <div class="synopsis-panel">
          <p id="videoSynopsis" class="synopsis-text"></p>
          <button class="synopsis-toggle" id="synopsisToggle">Baca selengkapnya</button>
        </div>

        <div class="external-fallback" id="externalFallbackContainer" style="display:none">
          <a id="externalPlayerBtn" href="#" target="_blank" class="btn-external">
            🔗 Buka Player di Tab Baru (Jika Layar Hitam / Terblokir)
          </a>
        </div>
      </div>

      <!-- Episode & Related: HANYA di sidebar (duplikat bawah player
           dihapus atas masukan user 2026-08-24) -->
    </div>

    <!-- Kolom kanan: sidebar -->
    <aside class="watch-sidebar">
      <div class="sidebar-episodes" id="sidebarEpisodes">
        <h2 class="sidebar-title">Episode</h2>
        <div class="episode-list" id="episodeList"></div>
      </div>

      <div class="sidebar-related" id="sidebarRelated">
        <h2 class="sidebar-title">Video Terkait</h2>
        <div class="related-list" id="relatedList"></div>
      </div>
    </aside>

  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav" id="bottomNav" style="display:none"></nav>

  <script src="/video/js/nav.js" defer></script>
  <script src="/video/js/watch.js?v=10" defer></script>
  <script src="/shared/bottom-nav.js" defer></script>
</body>
</html>
